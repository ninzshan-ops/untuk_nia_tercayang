<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu ❤️</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{font-family:Arial,Helvetica,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #matrix{z-index:0}
  #scene{z-index:1}
  .hint{
    position:fixed;z-index:3;left:50%;bottom:22px;transform:translateX(-50%);
    color:rgba(255,255,255,.65);font-size:12px;letter-spacing:1px;
    text-align:center;pointer-events:none;transition:opacity .8s
  }
  .start{
    position:fixed;z-index:5;inset:0;display:grid;place-items:center;
    background:radial-gradient(circle,rgba(25,25,25,.45),#000 70%);
    transition:opacity .8s
  }
  .start button{
    border:1px solid rgba(255,90,150,.65);background:rgba(20,0,10,.8);
    color:#fff;padding:14px 24px;border-radius:999px;font-size:16px;
    cursor:pointer;box-shadow:0 0 30px rgba(255,50,130,.25)
  }
  .start button:active{transform:scale(.96)}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<canvas id="scene"></canvas>

<div class="start" id="start">
  <button id="go">Klik untuk mulai ❤️</button>
</div>
<div class="hint" id="hint">tunggu sebentar...</div>

<script>
const matrix = document.getElementById("matrix");
const scene = document.getElementById("scene");
const m = matrix.getContext("2d");
const c = scene.getContext("2d");
const start = document.getElementById("start");
const hint = document.getElementById("hint");

let W,H,dpr;
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  for(const x of [matrix,scene]){
    x.width=W*dpr; x.height=H*dpr;
    x.style.width=W+"px"; x.style.height=H+"px";
  }
  m.setTransform(dpr,0,0,dpr,0,0);
  c.setTransform(dpr,0,0,dpr,0,0);
  initRain();
}
addEventListener("resize",resize);

const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZLOVE♡♥";
let drops=[];
function initRain(){
  const size=Math.max(13,Math.min(20,W/55));
  const cols=Math.ceil(W/size);
  drops=Array.from({length:cols},()=>Math.random()*H/size);
}
function rain(){
  m.fillStyle="rgba(0,0,0,.16)";
  m.fillRect(0,0,W,H);
  const size=Math.max(13,Math.min(20,W/55));
  m.font=size+"px monospace";
  for(let i=0;i<drops.length;i++){
    const x=i*size;
    const y=drops[i]*size;
    const ch=chars[(Math.random()*chars.length)|0];
    const bright=Math.random()>.88;
    m.fillStyle=bright?"rgba(255,120,180,.95)":"rgba(255,35,125,.45)";
    m.fillText(ch,x,y);
    if(y>H && Math.random()>.975) drops[i]=0;
    drops[i]+=.55+Math.random()*.8;
  }
  requestAnimationFrame(rain);
}

let particles=[];
let started=false;
let phase=0;
let phaseStart=0;
let last=0;

function makeParticles(text, color="#ff4f9a"){
  const off=document.createElement("canvas");
  const ox=off.getContext("2d");
  off.width=Math.min(900,W*1.6);
  off.height=Math.min(360,H*.6);
  const fontSize=Math.max(42,Math.min(115,off.width/(text.length*.62)));
  ox.fillStyle="#fff";
  ox.font=`900 ${fontSize}px Arial`;
  ox.textAlign="center"; ox.textBaseline="middle";
  ox.fillText(text,off.width/2,off.height/2);

  const data=ox.getImageData(0,0,off.width,off.height).data;
  particles=[];
  const step=Math.max(3,Math.floor(off.width/220));
  for(let y=0;y<off.height;y+=step){
    for(let x=0;x<off.width;x+=step){
      if(data[(y*off.width+x)*4+3]>120){
        particles.push({
          tx:x-off.width/2,
          ty:y-off.height/2,
          x:(Math.random()-.5)*W*1.4,
          y:(Math.random()-.5)*H*1.4,
          vx:(Math.random()-.5)*1.5,
          vy:(Math.random()-.5)*1.5,
          size:Math.random()*1.8+0.7,
          color
        });
      }
    }
  }
}

function drawParticles(t){
  c.clearRect(0,0,W,H);
  c.fillStyle="rgba(0,0,0,.12)";
  c.fillRect(0,0,W,H);

  const cx=W/2,cy=H/2;
  for(const p of particles){
    p.x += (cx+p.tx-p.x)*.055;
    p.y += (cy+p.ty-p.y)*.055;
    const pulse=1+Math.sin(t*.004+p.x*.01)*.35;
    c.beginPath();
    c.fillStyle=p.color;
    c.shadowBlur=9;
    c.shadowColor=p.color;
    c.arc(p.x,p.y,p.size*pulse,0,Math.PI*2);
    c.fill();
  }
  c.shadowBlur=0;
}

function burst(text,color){
  makeParticles(text,color);
  for(const p of particles){
    p.x=W/2+(Math.random()-.5)*70;
    p.y=H/2+(Math.random()-.5)*70;
  }
}

function heartPoints(){
  const pts=[];
  for(let i=0;i<particles.length;i++){
    const a=(i/particles.length)*Math.PI*2;
    const r=Math.min(W,H)*.22;
    const x=16*Math.pow(Math.sin(a),3)*r/16;
    const y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*r/16;
    pts.push({x,y});
  }
  return pts;
}

function setHeart(){
  const pts=heartPoints();
  particles.forEach((p,i)=>{
    p.tx=pts[i].x;
    p.ty=pts[i].y;
  });
}

function centerText(text){
  makeParticles(text,"#ff65aa");
  for(const p of particles){
    p.x=W/2+(Math.random()-.5)*100;
    p.y=H/2+(Math.random()-.5)*100;
  }
}

function explode(){
  for(const p of particles){
    const dx=p.x-W/2,dy=p.y-H/2;
    const len=Math.hypot(dx,dy)||1;
    p.x+=dx/len*(70+Math.random()*180);
    p.y+=dy/len*(70+Math.random()*180);
  }
}

function loop(t){
  if(!started)return;
  if(!last)last=t;
  const elapsed=t-phaseStart;

  // Timeline:
  // 0-2.5s: "ARE MY"
  // 2.5-5s: "LOVE"
  // 5-8.5s: "I LOVE YOU"
  // 8.5-12s: heart
  // 12s+: "SAYANG ❤️"
  if(phase===0 && elapsed>250){
    centerText("ARE MY");
    phase=1; phaseStart=t;
  } else if(phase===1 && elapsed>2600){
    centerText("LOVE");
    phase=2; phaseStart=t;
  } else if(phase===2 && elapsed>2400){
    centerText("I LOVE YOU");
    phase=3; phaseStart=t;
  } else if(phase===3 && elapsed>3000){
    setHeart();
    phase=4; phaseStart=t;
  } else if(phase===4 && elapsed>3300){
    centerText("SAYANG");
    phase=5; phaseStart=t;
  } else if(phase===5 && elapsed>3500){
    burst("SAYANG"," #ff4f9a".trim());
    phase=6; phaseStart=t;
  } else if(phase===6 && elapsed>1700){
    centerText("I LOVE YOU");
    phase=7; phaseStart=t;
  }

  drawParticles(t);
  requestAnimationFrame(loop);
}

document.getElementById("go").onclick=()=>{
  started=true;
  start.style.opacity="0";
  setTimeout(()=>start.remove(),800);
  hint.style.opacity="0";
  phase=0; phaseStart=performance.now();
  centerText("ARE MY");
  phase=1; phaseStart=performance.now();
  requestAnimationFrame(loop);
};

resize();
rain();
</script>
</body>
  </html>
